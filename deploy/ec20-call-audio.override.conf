[Service]
DynamicUser=no
User=ec20-call-audio
Group=ec20-call-audio
PrivateDevices=no
DevicePolicy=closed
DeviceAllow=char-alsa rw
RestrictAddressFamilies=
RestrictAddressFamilies=AF_INET AF_UNIX AF_NETLINK
ExecStart=
ExecStart=/opt/ec20-audio-loopback/current/ec20-audio-loopback -listen 127.0.0.1:8790 -media 192.0.2.10:8789 -gateway-key %d/audio.key -ec20-voice
