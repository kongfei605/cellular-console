[Service]
ExecStart=
ExecStart=/opt/ec20-console/current/ec20-console -listen 192.0.2.10:8787 -credentials /etc/ec20-console/credentials.json -data-dir /var/lib/ec20-console -tls-listen 192.0.2.10:8788 -tls-cert %d/tls.crt -tls-key %d/tls.key -public-origin https://192.0.2.10:8788 -audio-backend http://127.0.0.1:8790 -audio-gateway-key %d/audio.key -gnss-control -device-id 0000000000000000000000000000000000000000 -ec20-voice
