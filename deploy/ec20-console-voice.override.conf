[Service]
ExecStart=
ExecStart=/opt/ec20-console/current/ec20-console -listen 192.0.2.10:8787 -tls-listen 192.0.2.10:8788 -public-origin https://192.0.2.10:8788 -tls-cert /etc/ec20-audio-loopback/server.crt -tls-key /etc/ec20-audio-loopback/server.key -audio-backend http://127.0.0.1:8790 -audio-gateway-key /etc/ec20-console/audio-gateway.key -gnss-control -device-id 0000000000000000000000000000000000000000 -ec20-voice
